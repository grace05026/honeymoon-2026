<style>
:root{
  --paper:#F5F4F0;
  --paper2:#ECEBE6;
  --white:#FFFFFF;
  --ink:#252A2D;
  --soft:#737979;
  --line:#DCDDD8;

  --london:#58728B;
  --london-light:#E8EEF2;

  --cph:#B96B58;
  --cph-light:#F3E8E3;

  --tromso:#5D8E7B;
  --tromso-light:#E7F0EB;

  --paris:#A87586;
  --paris-light:#F1E8EC;

  --gold:#A8874D;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}

a{
  color:inherit;
}

.display{
  font-family:'Fraunces',serif;
}

.mono{
  font-family:'IBM Plex Mono',monospace;
}


/* =====================================================
   HERO
===================================================== */

.hero{
  max-width:940px;
  margin:0 auto;
  padding:58px 20px 30px;
  text-align:center;
}

.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.22em;
  color:var(--gold);
  margin-bottom:15px;
}

.hero h1{
  margin:0;
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:clamp(38px,7vw,58px);
  letter-spacing:-.025em;
}

.hero-sub{
  margin:10px 0 34px;
  color:var(--soft);
  font-size:13px;
  letter-spacing:.02em;
}


/* route */

.route{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:25px 25px 22px;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}

.route:before,
.route:after{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  border-radius:50%;
  background:var(--paper);
  border:1px solid var(--line);
  top:50%;
  transform:translateY(-50%);
}

.route:before{
  left:-12px;
}

.route:after{
  right:-12px;
}

.route-line{
  position:absolute;
  left:9%;
  right:9%;
  top:44%;
  height:1px;
  background:repeating-linear-gradient(
    90deg,
    var(--line) 0 6px,
    transparent 6px 12px
  );
}

.stop{
  position:relative;
  z-index:2;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
}

.stop-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 0 3px var(--white),
             0 0 0 4px currentColor;
  margin-bottom:7px;
}

.stop-city{
  font-family:'Fraunces',serif;
  font-size:16px;
  font-weight:600;
}

.stop-date{
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  color:var(--soft);
}

.stop.london{
  color:var(--london);
}

.stop.cph{
  color:var(--cph);
}

.stop.tromso{
  color:var(--tromso);
}

.stop.paris{
  color:var(--paris);
}


/* =====================================================
   NAV
===================================================== */

.navbar{
  position:sticky;
  top:0;
  z-index:100;
  padding:9px 0;
  background:rgba(245,244,240,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}

.nav-inner{
  max-width:940px;
  margin:auto;
  padding:0 16px;
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
}

.nav-inner::-webkit-scrollbar{
  display:none;
}

.nav-btn{
  flex:none;
  border:1px solid var(--line);
  background:var(--white);
  color:var(--soft);
  border-radius:999px;
  padding:7px 11px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  cursor:pointer;
}

.nav-btn.active{
  background:var(--ink);
  color:white;
  border-color:var(--ink);
}


/* =====================================================
   MAIN
===================================================== */

.wrap{
  max-width:940px;
  margin:0 auto;
  padding:35px 16px 70px;
}


/* =====================================================
   STAY
===================================================== */

.stay{
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:22px 22px 20px;
  margin-bottom:42px;
}

.section-title{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:13px;
}

.section-title h2{
  font-family:'Fraunces',serif;
  font-size:21px;
  margin:0;
}

.section-title span{
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  color:var(--soft);
  letter-spacing:.12em;
}

.hotel{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:10px 0;
  border-bottom:1px dashed var(--line);
}

.hotel:last-child{
  border-bottom:none;
}

.hotel-city{
  width:95px;
  flex:none;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  letter-spacing:.1em;
  color:var(--soft);
}

.hotel-name{
  flex:1;
  font-family:'Fraunces',serif;
  font-size:14px;
}

.hotel-link{
  flex:none;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  color:var(--soft);
  text-decoration:underline;
}


/* =====================================================
   CITY CHAPTER
===================================================== */

.chapter{
  margin:45px 0 17px;
  display:flex;
  align-items:center;
  gap:15px;
}

.chapter:first-child{
  margin-top:5px;
}

.chapter-mark{
  width:55px;
  height:55px;
  flex:none;
  border-radius:50%;
  border:1.5px dashed currentColor;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:'Fraunces',serif;
  font-size:10px;
  font-weight:600;
  text-align:center;

  transform:rotate(-7deg);
}

.chapter-copy h2{
  margin:0 0 2px;
  font-family:'Fraunces',serif;
  font-size:25px;
  font-weight:600;
}

.chapter-copy p{
  margin:0;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  color:var(--soft);
}

.chapter.london{
  color:var(--london);
}

.chapter.cph{
  color:var(--cph);
}

.chapter.tromso{
  color:var(--tromso);
}

.chapter.paris{
  color:var(--paris);
}


/* =====================================================
   DAY CARD — SHORT BAR
===================================================== */

.day{
  scroll-margin-top:70px;
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
  margin-bottom:9px;
  overflow:hidden;
  transition:.2s ease;
}

.day.open{
  box-shadow:0 7px 24px rgba(40,40,40,.055);
}


/* compact header */

.day-header{
  min-height:74px;
  display:flex;
  align-items:center;
  cursor:pointer;
}

.day-date{
  width:76px;
  min-height:74px;
  flex:none;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  color:white;
}

.day-date .number{
  font-family:'Fraunces',serif;
  font-size:25px;
  line-height:1;
  font-weight:600;
}

.day-date .month{
  margin-top:4px;
  font-family:'IBM Plex Mono',monospace;
  font-size:8px;
  letter-spacing:.08em;
  opacity:.9;
}

.day.london .day-date{
  background:var(--london);
}

.day.cph .day-date{
  background:var(--cph);
}

.day.tromso .day-date{
  background:var(--tromso);
}

.day.paris .day-date{
  background:var(--paris);
}


.day-summary{
  flex:1;
  min-width:0;
  padding:11px 15px;
}

.day-title{
  margin:0 0 4px;
  font-family:'Fraunces',serif;
  font-size:16px;
  font-weight:600;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.day-subtitle{
  margin:0;
  font-size:11px;
  color:var(--soft);

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.day-arrow{
  width:48px;
  flex:none;
  text-align:center;
  color:#999;
  font-size:16px;
  transition:.2s ease;
}

.day.open .day-arrow{
  transform:rotate(180deg);
}


/* =====================================================
   ILLUSTRATION AREA
===================================================== */

.day-content{
  display:none;
  padding:0 15px 16px 91px;
}

.day.open .day-content{
  display:block;
}

.illustration{
  width:100%;
  height:130px;
  margin:0 0 16px;
  border-radius:11px;
  overflow:hidden;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--line);
}

.day.london .illustration{
  background:var(--london-light);
}

.day.cph .illustration{
  background:var(--cph-light);
}

.day.tromso .illustration{
  background:var(--tromso-light);
}

.day.paris .illustration{
  background:var(--paris-light);
}


/* hand drawn illustration */

.illustration svg{
  width:100%;
  height:100%;
}

.illustration-label{
  position:absolute;
  bottom:9px;
  left:11px;

  font-family:'IBM Plex Mono',monospace;
  font-size:8px;
  letter-spacing:.13em;

  color:rgba(37,42,45,.6);
}


/* =====================================================
   CONTENT
===================================================== */

.section{
  margin-top:11px;
}

.section-label{
  margin-bottom:4px;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  color:var(--soft);
  letter-spacing:.08em;
}

.section-items{
  font-size:12.5px;
  line-height:1.7;
}

.section-items a{
  text-decoration:none;
  border-bottom:1px dotted #AEB2B0;
}

.section-items a:hover{
  color:var(--gold);
}

.note{
  margin-top:12px;
  padding:9px 11px;
  border-left:3px solid var(--gold);
  background:var(--paper2);
  border-radius:0 7px 7px 0;
  color:var(--soft);
  font-size:11px;
  line-height:1.6;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
  text-align:center;
  padding:35px 15px 55px;
  color:#969A98;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  letter-spacing:.05em;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .hero{
    padding:42px 15px 24px;
  }

  .route{
    padding:21px 8px 19px;
  }

  .stop-city{
    font-size:12px;
  }

  .stop-date{
    font-size:8px;
  }

  .stop-dot{
    width:8px;
    height:8px;
  }

  .wrap{
    padding:25px 12px 60px;
  }

  .hotel-city{
    width:72px;
  }

  .hotel-name{
    font-size:13px;
  }

  .day-date{
    width:62px;
  }

  .day-title{
    font-size:14px;
  }

  .day-content{
    padding-left:76px;
  }

  .illustration{
    height:115px;
  }
}
</style>

/* =====================================================
   RENDER LINK
===================================================== */

function renderItem(item){

  if(typeof item === "string"){
    return item;
  }

  return `
    <a
      href="${item.url}"
      target="_blank"
      rel="noopener"
    >
      ${item.text}
    </a>
  `;
}


/* =====================================================
   HOTELS
===================================================== */

function buildHotels(){

  document.getElementById("hotels").innerHTML =
    HOTELS.map(h => `
      <div class="hotel">

        <div class="hotel-city">
          ${h.city}
        </div>

        <div class="hotel-name">
          ${h.name}
        </div>

        <a
          class="hotel-link"
          href="${h.url}"
          target="_blank"
          rel="noopener"
        >
          MAP
        </a>

      </div>
    `).join("");
}


/* =====================================================
   NAV
===================================================== */

function buildNav(){

  document.getElementById("nav").innerHTML =
    DAYS.map(d => `
      <button
        class="nav-btn"
        data-day="${d.d}"
      >
        D${d.d}
      </button>
    `).join("");

  document.querySelectorAll(".nav-btn").forEach(btn => {

    btn.addEventListener("click", () => {

      const target =
        document.getElementById("day-" + btn.dataset.day);

      if(target){

        target.scrollIntoView({
          behavior:"smooth",
          block:"start"
        });

        target.classList.add("open");

      }

    });

  });

}

/* =====================================================
   BUILD DAYS
===================================================== */

function buildDays(){

  const container =
    document.getElementById("days");

  let html = "";

  let previousCity = null;

  DAYS.forEach(day => {

    if(day.city !== previousCity){

      const chapter = CHAPTERS[day.city];

      html += `
        <div class="chapter ${day.city}">

          <div class="chapter-mark">
            ${chapter.name}
          </div>

          <div class="chapter-copy">

            <h2>${chapter.label}</h2>

            <p>${chapter.nights}</p>

          </div>

        </div>
      `;

      previousCity = day.city;

    }


    const sections =
      day.sections.map(section => `

        <div class="section">

          <div class="section-label">
            ${section.label}
          </div>

          <div class="section-items">
            ${section.items.map(renderItem).join(" · ")}
          </div>

        </div>

      `).join("");


    html += `

      <article
        class="day ${day.city}"
        id="day-${day.d}"
      >

        <div
          class="day-header"
          onclick="toggleDay(${day.d})"
        >

          <div class="day-date">

            <div class="number">
              ${day.d}
            </div>

            <div class="month">
              ${day.month}
            </div>

          </div>


          <div class="day-summary">

            <p class="day-title">
              ${day.title}
            </p>

            <p class="day-subtitle">
              ${day.subline}
            </p>

          </div>


          <div class="day-arrow">
            ↓
          </div>

        </div>


        <div class="day-content">

          <div class="illustration">

            ${illustration(day.art)}

            <div class="illustration-label">
              ${CHAPTERS[day.city].name}
            </div>

          </div>


          ${sections}


          ${
            day.note
            ?
            `<div class="note">
              ${day.note}
            </div>`
            :
            ""
          }

        </div>

      </article>

    `;

  });


  container.innerHTML = html;
}


/* =====================================================
   TOGGLE
===================================================== */

function toggleDay(day){

  const el =
    document.getElementById("day-" + day);

  if(!el) return;

  el.classList.toggle("open");

}


/* =====================================================
   INIT
===================================================== */

buildHotels();
buildNav();
buildDays();


/* =====================================================
   OPEN FIRST DAY OF EACH CITY
===================================================== */

[1,8,12,16].forEach(day => {

  const el =
    document.getElementById("day-" + day);

  if(el){
    el.classList.add("open");
  }

});
