<style>

:root{
  --paper:#F7F5F0;
  --white:#FFFDF9;
  --ink:#30343A;
  --soft:#7B7E7C;
  --line:#DEDAD2;

  --london:#58728B;
  --cph:#B96855;
  --tromso:#5C9A82;
  --paris:#B17B8C;

  --shadow:0 8px 25px rgba(50,45,35,.06);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans TC',sans-serif;
  -webkit-font-smoothing:antialiased;
}

a{
  color:inherit;
}

.display{
  font-family:'Fraunces',serif;
}

/* =========================
   HERO
========================= */

.hero{
  max-width:940px;
  margin:auto;
  padding:58px 20px 34px;
  text-align:center;
  position:relative;
}

.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.16em;
  color:#9A8A69;
  margin-bottom:13px;
}

.hero h1{
  font-family:'Fraunces',serif;
  font-size:clamp(42px,8vw,66px);
  line-height:1;
  font-weight:600;
  letter-spacing:-.04em;
  margin:0;
}

.hero-sub{
  margin:12px 0 28px;
  color:var(--soft);
  font-size:14px;
}

/* 小手繪裝飾 */

.doodle{
  position:absolute;
  font-family:'Fraunces',serif;
  color:#8C887E;
  opacity:.55;
  pointer-events:none;
}

.doodle.rabbit{
  left:4%;
  top:46px;
  font-size:38px;
  transform:rotate(-7deg);
}

.doodle.plane{
  right:5%;
  top:62px;
  font-size:30px;
  transform:rotate(-10deg);
}

.doodle.star{
  right:14%;
  bottom:95px;
  font-size:22px;
}

.doodle.heart{
  left:15%;
  bottom:92px;
  font-size:20px;
}

/* =========================
   ROUTE
========================= */

.route{
  position:relative;
  display:flex;
  justify-content:space-between;
  align-items:center;

  background:var(--white);
  border:1px solid var(--line);
  border-radius:20px;

  padding:25px 25px 22px;

  box-shadow:var(--shadow);
}

.route-line{
  position:absolute;
  left:11%;
  right:11%;
  top:39px;

  height:1px;

  background:
    repeating-linear-gradient(
      90deg,
      #D6D1C8 0 6px,
      transparent 6px 13px
    );
}

.stop{
  position:relative;
  z-index:2;

  flex:1;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:5px;
}

.stop-dot{
  width:13px;
  height:13px;

  background:var(--white);

  border:3px solid currentColor;

  border-radius:50%;
}

.stop-city{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:16px;
}

.stop-date{
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  color:var(--soft);
}

.stop.london{
  color:var(--london);
}

.stop.cph{
  color:var(--cph);
}

.stop.tromso{
  color:var(--tromso);
}

.stop.paris{
  color:var(--paris);
}

/* =========================
   NAV
========================= */

.navbar{
  position:sticky;
  top:0;
  z-index:30;

  background:rgba(247,245,240,.92);
  backdrop-filter:blur(12px);

  border-bottom:1px solid var(--line);
}

.navbar-inner{
  max-width:940px;
  margin:auto;

  padding:10px 16px;

  display:flex;
  gap:7px;

  overflow-x:auto;
  scrollbar-width:none;
}

.navbar-inner::-webkit-scrollbar{
  display:none;
}

.pill{
  flex:none;

  border:1px solid var(--line);
  background:var(--white);

  border-radius:999px;

  padding:7px 11px;

  font-family:'IBM Plex Mono',monospace;
  font-size:10px;

  color:#777;

  cursor:pointer;
}

.pill:hover{
  background:#EEEAE2;
}

/* =========================
   MAIN
========================= */

.wrap{
  max-width:940px;
  margin:auto;
  padding:28px 16px 70px;
}

/* =========================
   CITY CHAPTER
========================= */

.chapter{
  margin:48px 0 20px;

  display:flex;
  align-items:center;
  gap:16px;

  position:relative;
}

.chapter:first-child{
  margin-top:8px;
}

.city-stamp{
  width:70px;
  height:70px;

  flex:none;

  border-radius:50%;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  border:1.5px dashed currentColor;

  transform:rotate(-5deg);

  background:rgba(255,255,255,.35);
}

.city-stamp strong{
  font-family:'Fraunces',serif;
  font-size:12px;
  line-height:1.1;
}

.city-stamp span{
  font-size:9px;
  margin-top:3px;
  opacity:.7;
}

.chapter-title h2{
  margin:0;

  font-family:'Fraunces',serif;
  font-size:27px;
  font-weight:600;
}

.chapter-title p{
  margin:3px 0 0;

  font-size:11px;
  color:var(--soft);
}

/* =========================
   DOODLE STRIP
========================= */

.doodle-strip{
  display:flex;
  gap:12px;
  align-items:center;

  margin:0 0 18px 86px;

  color:#9A958B;
  opacity:.65;

  font-family:'Fraunces',serif;
  font-size:20px;
}

.doodle-line{
  width:42px;
  height:1px;
  background:#CFC9BE;
}

/* =========================
   DAY CARD
========================= */

.day{
  display:grid;

  grid-template-columns:70px 1fr;

  background:var(--white);

  border:1px solid var(--line);
  border-radius:17px;

  margin-bottom:13px;

  overflow:hidden;

  box-shadow:0 4px 16px rgba(50,45,35,.035);

  scroll-margin-top:70px;
}

/* 左側日期 */

.date-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  color:white;

  padding:14px 7px;

  text-align:center;
}

.date-box .day-number{
  font-family:'Fraunces',serif;
  font-size:27px;
  font-weight:700;
  line-height:1;
}

.date-box .weekday{
  margin-top:4px;

  font-size:9px;
  opacity:.9;
}

.date-box .date{
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;

  margin-top:3px;
  opacity:.9;
}

.date-box.london{
  background:var(--london);
}

.date-box.cph{
  background:var(--cph);
}

.date-box.tromso{
  background:var(--tromso);
}

.date-box.paris{
  background:var(--paris);
}

/* 內容 */

.day-content{
  padding:14px 17px 15px;

  min-width:0;
}

.day-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  gap:10px;
}

.day-title{
  margin:0;

  font-family:'Fraunces',serif;
  font-size:18px;
  font-weight:600;

  line-height:1.25;
}

.day-subtitle{
  margin:4px 0 10px;

  font-size:11px;
  color:var(--soft);
}

/* =========================
   PHOTO
========================= */

.photo-row{
  display:flex;
  gap:9px;

  margin:8px 0 12px;

  overflow:hidden;
}

.photo{
  width:150px;
  height:92px;

  flex:none;

  object-fit:cover;

  border-radius:11px;

  border:1px solid #E0DCD4;

  background:#EEEAE2;
}

.photo.single{
  width:190px;
}

/* =========================
   CONTENT TAGS
========================= */

.highlight{
  display:flex;
  flex-wrap:wrap;
  gap:6px;

  margin-top:7px;
}

.tag{
  display:inline-flex;
  align-items:center;

  background:#F1EEE8;

  border:1px solid #E3DED5;

  border-radius:999px;

  padding:5px 9px;

  font-size:11px;

  text-decoration:none;
}

.tag:hover{
  background:#E8E2D8;
}

.tag::before{
  content:"";
  width:5px;
  height:5px;

  border-radius:50%;

  background:#AAA39A;

  margin-right:6px;
}

/* =========================
   SMALL DOODLE
========================= */

.day-doodle{
  float:right;

  font-family:'Fraunces',serif;

  font-size:25px;

  color:#B3ADA2;

  transform:rotate(5deg);

  opacity:.55;
}

/* =========================
   HOTELS
========================= */

.info-block{
  background:var(--white);

  border:1px solid var(--line);

  border-radius:17px;

  padding:18px;

  margin-bottom:22px;

  box-shadow:var(--shadow);
}

.info-title{
  font-family:'Fraunces',serif;
  font-size:20px;

  margin:0 0 12px;
}

.hotel{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:9px 0;

  border-bottom:1px dashed var(--line);

  font-size:12px;
}

.hotel:last-child{
  border-bottom:0;
}

.hotel-city{
  color:var(--soft);
  font-size:10px;
  margin-left:6px;
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;

  padding:35px 20px 55px;

  font-size:10px;

  color:#99938A;

  font-family:'IBM Plex Mono',monospace;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .hero{
    padding-top:40px;
  }

  .doodle.rabbit{
    left:2%;
    font-size:27px;
  }

  .doodle.plane{
    right:2%;
    font-size:23px;
  }

  .route{
    padding:20px 8px;
  }

  .stop-city{
    font-size:13px;
  }

  .stop-date{
    font-size:8px;
  }

  .day{
    grid-template-columns:58px 1fr;
  }

  .date-box .day-number{
    font-size:23px;
  }

  .day-content{
    padding:12px 13px;
  }

  .day-title{
    font-size:16px;
  }

  .photo{
    width:125px;
    height:82px;
  }

  .photo.single{
    width:165px;
  }

  .chapter-title h2{
    font-size:24px;
  }

  .city-stamp{
    width:62px;
    height:62px;
  }

  .doodle-strip{
    margin-left:74px;
  }

}

/* =====================================
   Render Hotels
===================================== */

function renderHotels(){

  const el=document.getElementById("hotels");

  el.innerHTML=HOTELS.map(h=>`

    <div class="hotel">

      <span>
        ${h.name}
        <span class="hotel-city">${h.city}</span>
      </span>

    </div>

  `).join("");

}


/* =====================================
   Render Navigation
===================================== */

function renderNav(){

  const nav=document.getElementById("navbar");

  nav.innerHTML=DAYS.map(d=>`

    <button
      class="pill"
      data-day="${d.d}"
    >
      D${d.d}
    </button>

  `).join("");

  nav.addEventListener("click",function(e){

    const btn=e.target.closest(".pill");

    if(!btn)return;

    const target=document.getElementById(
      "day-"+btn.dataset.day
    );

    if(target){

      target.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    }

  });

}


/* =====================================
   Render Days
===================================== */

function renderDays(){

  const el=document.getElementById("days");

  let html="";
  let previousCity=null;

  DAYS.forEach(d=>{

    if(d.city!==previousCity){

      const c=CHAPTERS[d.city];

      html+=`

        <div class="chapter">

          <div
            class="city-stamp"
            style="color:var(--${c.color})"
          >

            <strong>${c.english}</strong>

            <span>${c.label}</span>

          </div>

          <div class="chapter-title">

            <h2>${c.label}</h2>

            <p>${c.nights}</p>

          </div>

        </div>

        <div class="doodle-strip">

          <span>${c.doodle}</span>
          <div class="doodle-line"></div>
          <span>旅途中</span>
          <div class="doodle-line"></div>
          <span>${c.doodle}</span>

        </div>

      `;

      previousCity=d.city;

    }


    let photos="";

    if(d.photos && d.photos.length){

      photos=`

        <div class="photo-row">

          ${d.photos.map((src,i)=>`

            <img
              class="photo ${d.photos.length===1?'single':''}"
              src="${src}"
              loading="lazy"
              alt="${d.title}"
            >

          `).join("")}

        </div>

      `;

    }


    const tags=d.items.map(item=>{

      if(typeof item==="string"){

        return `<span class="tag">${item}</span>`;

      }

      return `
        <a
          class="tag"
          href="${item.url}"
          target="_blank"
          rel="noopener"
        >
          ${item.text}
        </a>
      `;

    }).join("");


    html+=`

      <article
        class="day"
        id="day-${d.d}"
      >

        <div class="date-box ${d.city}">

          <div class="day-number">
            ${d.d}
          </div>

          <div class="weekday">
            週${d.wd}
          </div>

          <div class="date">
            ${d.date}
          </div>

        </div>


        <div class="day-content">

          <div class="day-header">

            <div>

              <h3 class="day-title">
                ${d.title}
              </h3>

              <p class="day-subtitle">
                ${d.sub}
              </p>

            </div>

            <div class="day-doodle">
              ${d.doodle}
            </div>

          </div>


          ${photos}


          <div class="highlight">

            ${tags}

          </div>

        </div>

      </article>

    `;

  });


  el.innerHTML=html;

}


/* =====================================
   Init
===================================== */

renderHotels();
renderNav();
renderDays();

</script>
