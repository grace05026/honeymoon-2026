<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Europe Honeymoon · 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#F7F3EC;
  --paper:#FCFAF6;
  --ink:#24303A;
  --muted:#788087;
  --line:#DDD7CD;

  --london:#536F88;
  --london-soft:#E7EDF1;

  --cph:#B85D49;
  --cph-soft:#F2E3DE;

  --tromso:#477D68;
  --tromso-soft:#E3EEE9;

  --paris:#B47A91;
  --paris-soft:#F2E5EA;

  --gold:#B08A4A;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:"DM Sans","Noto Sans TC",sans-serif;
  -webkit-font-smoothing:antialiased;
}

a{
  color:inherit;
}

img{
  display:block;
  max-width:100%;
}

.serif{
  font-family:"DM Serif Display","Noto Serif TC",serif;
}

.mono{
  font-family:"IBM Plex Mono",monospace;
}


/* =========================================================
   HERO
========================================================= */

.hero{
  position:relative;
  max-width:1120px;
  margin:auto;
  padding:68px 28px 42px;
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  border:1px solid rgba(176,138,74,.25);
  border-radius:50%;
  top:-100px;
  right:-70px;
}

.hero::after{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  border:1px dashed rgba(176,138,74,.3);
  border-radius:50%;
  bottom:-60px;
  left:-40px;
}

.hero-inner{
  position:relative;
  z-index:2;
}

.hero-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:38px;
}

.eyebrow{
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
  letter-spacing:.18em;
  color:var(--gold);
  text-transform:uppercase;
}

.hero-stamp{
  width:76px;
  height:76px;
  border:1px dashed var(--gold);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:var(--gold);
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  line-height:1.4;
  transform:rotate(8deg);
}

.hero h1{
  font-family:"DM Serif Display","Noto Serif TC",serif;
  font-size:clamp(56px,9vw,112px);
  line-height:.9;
  font-weight:400;
  letter-spacing:-.04em;
  margin:0;
}

.hero-sub{
  display:flex;
  align-items:center;
  gap:14px;
  margin-top:20px;
  color:var(--muted);
  font-size:14px;
}

.hero-sub-line{
  width:46px;
  height:1px;
  background:var(--gold);
}

.hero-date{
  margin-top:30px;
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:.08em;
  color:var(--muted);
}


/* =========================================================
   ROUTE
========================================================= */

.route-card{
  position:relative;
  margin-top:44px;
  background:var(--paper);
  border:1px solid var(--line);
  padding:30px 34px;
  border-radius:4px;
  box-shadow:0 10px 30px rgba(40,35,28,.05);
}

.route-card::before{
  content:"";
  position:absolute;
  left:-8px;
  right:-8px;
  top:50%;
  border-top:1px dashed var(--line);
  z-index:0;
}

.route{
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.stop{
  background:var(--paper);
  text-align:center;
}

.stop-circle{
  width:58px;
  height:58px;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid currentColor;
  background:var(--paper);
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:.05em;
}

.stop-name{
  margin-top:10px;
  font-family:"DM Serif Display",serif;
  font-size:18px;
}

.stop-date{
  margin-top:3px;
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  color:var(--muted);
}

.london{color:var(--london);}
.cph{color:var(--cph);}
.tromso{color:var(--tromso);}
.paris{color:var(--paris);}


/* =========================================================
   NAV
========================================================= */

.nav-wrap{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(247,243,236,.9);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(221,215,205,.8);
}

.nav{
  max-width:1120px;
  margin:auto;
  padding:10px 20px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.nav::-webkit-scrollbar{
  display:none;
}

.nav button{
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--muted);
  border-radius:30px;
  padding:7px 12px;
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
  cursor:pointer;
  white-space:nowrap;
}

.nav button:hover,
.nav button.active{
  background:var(--ink);
  color:white;
  border-color:var(--ink);
}


/* =========================================================
   MAIN
========================================================= */

.container{
  max-width:1000px;
  margin:auto;
  padding:25px 24px 100px;
}


/* =========================================================
   CITY CHAPTER
========================================================= */

.city-section{
  margin-top:80px;
  scroll-margin-top:75px;
}

.city-header{
  position:relative;
  display:grid;
  grid-template-columns:150px 1fr;
  gap:34px;
  align-items:center;
  margin-bottom:36px;
}

.city-badge{
  width:128px;
  height:128px;
  border-radius:50%;
  border:1.5px dashed currentColor;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  transform:rotate(-7deg);
  position:relative;
}

.city-badge::before{
  content:"";
  position:absolute;
  inset:7px;
  border:1px solid currentColor;
  border-radius:50%;
  opacity:.25;
}

.city-badge .country{
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:.15em;
}

.city-badge .english{
  font-family:"DM Serif Display",serif;
  font-size:22px;
  line-height:1;
  margin-top:4px;
}

.city-badge .nights{
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  margin-top:8px;
  opacity:.7;
}

.city-title small{
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:.16em;
  color:var(--muted);
}

.city-title h2{
  font-family:"DM Serif Display","Noto Serif TC",serif;
  font-size:54px;
  font-weight:400;
  margin:4px 0;
  line-height:1;
}

.city-title p{
  margin:10px 0 0;
  color:var(--muted);
  font-size:13px;
}


/* =========================================================
   DAY CARD
========================================================= */

.day{
  position:relative;
  display:grid;
  grid-template-columns:90px 1fr;
  gap:24px;
  margin:0 0 32px;
  padding-bottom:32px;
  border-bottom:1px solid var(--line);
  scroll-margin-top:80px;
}

.day:last-child{
  border-bottom:none;
}

.day-number{
  padding-top:4px;
}

.day-number strong{
  display:block;
  font-family:"DM Serif Display",serif;
  font-size:38px;
  line-height:1;
  font-weight:400;
}

.day-number span{
  display:block;
  margin-top:7px;
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  color:var(--muted);
}

.day-content{
  min-width:0;
}

.day-top{
  display:flex;
  justify-content:space-between;
  gap:20px;
}

.day-title{
  margin:0;
  font-family:"DM Serif Display","Noto Serif TC",serif;
  font-size:28px;
  font-weight:400;
  line-height:1.05;
}

.day-subtitle{
  margin:8px 0 0;
  color:var(--muted);
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:.04em;
}


/* =========================================================
   PHOTO AREA
========================================================= */

.photos{
  display:flex;
  gap:12px;
  margin:18px 0 20px;
  align-items:flex-start;
}

.photo{
  width:175px;
  height:118px;
  overflow:hidden;
  background:#ddd;
  position:relative;
  border-radius:2px;
}

.photo:nth-child(2){
  margin-top:16px;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .5s ease;
}

.photo:hover img{
  transform:scale(1.04);
}


/* =========================================================
   DAY DETAILS
========================================================= */

.highlights{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:18px;
}

.highlight{
  display:inline-flex;
  align-items:center;
  padding:7px 11px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:30px;
  font-size:11px;
}

.highlight a{
  text-decoration:none;
}

.highlight a:hover{
  color:var(--gold);
}

.time{
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  color:var(--muted);
  margin-right:7px;
}

.day-meta{
  display:flex;
  gap:18px;
  margin-top:17px;
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  color:var(--muted);
}

.day-meta strong{
  color:var(--ink);
  font-weight:500;
}


/* =========================================================
   SPECIAL FEATURE DAY
========================================================= */

.day.feature{
  display:block;
  padding-bottom:42px;
}

.feature .day-number{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:10px;
}

.feature .day-number strong{
  font-size:32px;
}

.feature .day-title{
  font-size:42px;
}

.feature-photo{
  margin-top:22px;
  width:min(650px,100%);
  height:260px;
  overflow:hidden;
  position:relative;
}

.feature-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.feature-caption{
  position:absolute;
  bottom:13px;
  left:14px;
  background:rgba(252,250,246,.9);
  padding:7px 10px;
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  letter-spacing:.08em;
}


/* =========================================================
   STAY
========================================================= */

.stay{
  margin-top:80px;
  padding-top:40px;
  border-top:1px solid var(--line);
}

.stay-title{
  font-family:"DM Serif Display",serif;
  font-size:42px;
  font-weight:400;
}

.stay-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:22px;
}

.stay-card{
  background:var(--paper);
  border:1px solid var(--line);
  padding:17px;
}

.stay-card small{
  font-family:"IBM Plex Mono",monospace;
  font-size:8px;
  letter-spacing:.1em;
  color:var(--muted);
}

.stay-card h4{
  font-family:"DM Serif Display",serif;
  font-size:18px;
  font-weight:400;
  margin:6px 0 8px;
}

.stay-card p{
  margin:0;
  font-size:11px;
  line-height:1.5;
  color:var(--muted);
}


/* =========================================================
   FOOTER
========================================================= */

footer{
  max-width:1000px;
  margin:auto;
  padding:35px 24px 70px;
  text-align:center;
  color:var(--muted);
  font-family:"IBM Plex Mono",monospace;
  font-size:9px;
  letter-spacing:.08em;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:720px){

  .hero{
    padding:44px 20px 30px;
  }

  .hero h1{
    font-size:58px;
  }

  .hero-top{
    margin-bottom:28px;
  }

  .hero-stamp{
    width:62px;
    height:62px;
  }

  .route-card{
    padding:22px 12px;
  }

  .route{
    gap:4px;
  }

  .stop-circle{
    width:48px;
    height:48px;
    font-size:7px;
  }

  .stop-name{
    font-size:14px;
  }

  .stop-date{
    font-size:7px;
  }

  .container{
    padding-left:16px;
    padding-right:16px;
  }

  .city-header{
    grid-template-columns:100px 1fr;
    gap:20px;
  }

  .city-badge{
    width:92px;
    height:92px;
  }

  .city-badge .english{
    font-size:16px;
  }

  .city-title h2{
    font-size:40px;
  }

  .day{
    grid-template-columns:55px 1fr;
    gap:15px;
  }

  .day-number strong{
    font-size:29px;
  }

  .day-title{
    font-size:23px;
  }

  .photos{
    gap:8px;
  }

  .photo{
    width:130px;
    height:90px;
  }

  .feature .day-title{
    font-size:34px;
  }

  .feature-photo{
    height:210px;
  }

  .stay-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:450px){

  .hero h1{
    font-size:50px;
  }

  .route{
    grid-template-columns:repeat(2,1fr);
    row-gap:22px;
  }

  .route-card::before{
    display:none;
  }

  .city-header{
    grid-template-columns:86px 1fr;
  }

  .city-badge{
    width:82px;
    height:82px;
  }

  .city-badge .english{
    font-size:14px;
  }

  .city-title h2{
    font-size:34px;
  }

  .day{
    grid-template-columns:45px 1fr;
  }

  .photo{
    width:115px;
    height:82px;
  }

  .stay-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

/* =========================================================
   住宿
========================================================= */

const HOTELS = [

  {
    city:"LONDON",
    name:"Best Western Buckingham Palace Rd"
  },

  {
    city:"COPENHAGEN",
    name:"Wakeup Copenhagen, Bernstorffsgade"
  },

  {
    city:"TROMSØ",
    name:"Skaret By Vander"
  },

  {
    city:"PARIS",
    name:"Paris · Honeymoon Stay"
  }

];


/* =========================================================
   Render Navigation
========================================================= */

function buildNav(){

  const nav=document.getElementById("nav");

  nav.innerHTML=DAYS.map(d=>`
    <button data-target="day-${d.d}">
      D${String(d.d).padStart(2,"0")}
    </button>
  `).join("");

  nav.addEventListener("click",e=>{

    const btn=e.target.closest("button");

    if(!btn) return;

    const target=document.getElementById(btn.dataset.target);

    if(target){

      target.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    }

  });

}


/* =========================================================
   Render Photo
========================================================= */

function renderPhotos(photos){

  if(!photos || !photos.length) return "";

  return `
    <div class="photos">
      ${photos.map(p=>`
        <div class="photo">
          <img
            src="${p[0]}"
            alt="${p[1]}"
            loading="lazy"
            onerror="this.parentElement.style.display='none'"
          >
        </div>
      `).join("")}
    </div>
  `;

}


/* =========================================================
   Render City
========================================================= */

function renderCity(cityKey){

  const c=CITIES[cityKey];

  return `
    <section
      class="city-section ${c.color}"
      id="${cityKey}"
    >

      <div class="city-header">

        <div class="city-badge">

          <div class="country">
            ${c.country}
          </div>

          <div class="english">
            ${c.english}
          </div>

          <div class="nights">
            ${c.nights}
          </div>

        </div>

        <div class="city-title">

          <small>
            CHAPTER
          </small>

          <h2>
            ${c.chinese}
          </h2>

          <p>
            ${c.dates} · ${c.intro}
          </p>

        </div>

      </div>

      ${DAYS
        .filter(d=>d.city===cityKey)
        .map(renderDay)
        .join("")}

    </section>
  `;

}


/* =========================================================
   Render Day
========================================================= */

function renderDay(d){

  const isFeature =
    [4,6,13,14,22].includes(d.d);

  return `

    <article
      class="day ${isFeature ? "feature":""}"
      id="day-${d.d}"
    >

      <div class="day-number">

        <strong>
          ${String(d.d).padStart(2,"0")}
        </strong>

        <span>
          ${d.date}<br>
          ${d.wd}
        </span>

      </div>


      <div class="day-content">

        <div class="day-top">

          <div>

            <h3 class="day-title">
              ${d.title}
            </h3>

            <div class="day-subtitle">
              ${d.subtitle}
            </div>

          </div>

        </div>


        ${isFeature && d.photo ? `

          <div class="feature-photo">

            <img
              src="${d.photo[0][0]}"
              alt="${d.photo[0][1]}"
              loading="lazy"
              onerror="this.parentElement.style.display='none'"
            >

            <div class="feature-caption">
              ${d.photo[0][1].toUpperCase()}
            </div>

          </div>

        ` : renderPhotos(d.photo)}


        <div class="highlights">

          ${d.highlights.map(item=>`

            <span class="highlight">
              ${item}
            </span>

          `).join("")}

        </div>


        ${(d.meal || d.meta) ? `

          <div class="day-meta">

            ${d.meal ? `
              <span>
                FOOD
                <strong>${d.meal}</strong>
              </span>
            `:""}

            ${d.meta ? `
              <span>
                ${d.meta}
              </span>
            `:""}

          </div>

        `:""}

      </div>

    </article>

  `;

}


/* =========================================================
   Render Stay
========================================================= */

function renderStay(){

  return `

    <section class="stay">

      <div class="eyebrow">
        WHERE WE STAY
      </div>

      <div class="stay-title">
        Our Little Homes
      </div>

      <div class="stay-grid">

        ${HOTELS.map(h=>`

          <div class="stay-card">

            <small>
              ${h.city}
            </small>

            <h4>
              ${h.name}
            </h4>

            <p>
              Honeymoon stay
            </p>

          </div>

        `).join("")}

      </div>

    </section>

  `;

}


/* =========================================================
   Build App
========================================================= */

function build(){

  buildNav();

  const app=document.getElementById("app");

  const cityOrder=[
    "london",
    "cph",
    "tromso",
    "paris"
  ];

  app.innerHTML=
    cityOrder.map(renderCity).join("")
    +
    renderStay();

}

build();


/* =========================================================
   Active navigation
========================================================= */

const sections=
  document.querySelectorAll(".city-section");

const buttons=
  document.querySelectorAll(".nav button");

const observer=
  new IntersectionObserver(
    entries=>{

      entries.forEach(entry=>{

        if(entry.isIntersecting){

          buttons.forEach(btn=>{
            btn.classList.remove("active");
          });

          const button=
            document.querySelector(
              `.nav button[data-target="${entry.target.id}"]`
            );

          if(button){
            button.classList.add("active");
          }

        }

      });

    },
    {
      rootMargin:"-30% 0px -60% 0px"
    }
  );

sections.forEach(section=>{
  observer.observe(section);
});

</script>
