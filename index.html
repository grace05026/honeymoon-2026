<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>歐洲蜜月 2026｜Luka & Grace</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#f7f4ef;
  --paper:#fffdf9;
  --ink:#2c2926;
  --soft:#77716a;
  --line:#e4ddd3;

  --london:#607b91;
  --cph:#b96550;
  --tromso:#5d907d;
  --paris:#a87589;

  --cream:#eee7dc;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans TC',sans-serif;
  -webkit-font-smoothing:antialiased;
}

img{
  display:block;
}

/* =========================
   HERO
========================= */

.hero{
  max-width:920px;
  margin:0 auto;
  padding:58px 20px 30px;
  text-align:center;
}

.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.18em;
  color:#a18a68;
  margin-bottom:12px;
}

.hero h1{
  margin:0;
  font-family:'DM Serif Display',serif;
  font-size:clamp(42px,8vw,68px);
  font-weight:400;
  letter-spacing:-.02em;
}

.hero .sub{
  margin:8px 0 28px;
  color:var(--soft);
  font-size:14px;
}

/* route */

.route{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;

  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;

  padding:24px 25px;
  box-shadow:0 5px 20px rgba(70,55,40,.04);
}

.route-line{
  position:absolute;
  left:10%;
  right:10%;
  top:50%;

  height:1px;

  background:repeating-linear-gradient(
    90deg,
    #d9d0c4 0 6px,
    transparent 6px 12px
  );
}

.stop{
  position:relative;
  z-index:2;

  flex:1;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:4px;
}

.stop .dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:currentColor;

  box-shadow:
    0 0 0 4px var(--paper),
    0 0 0 5px currentColor;
}

.stop .city{
  margin-top:5px;
  font-family:'DM Serif Display',serif;
  font-size:17px;
}

.stop .date{
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  color:var(--soft);
}

.stop.london{color:var(--london);}
.stop.cph{color:var(--cph);}
.stop.tromso{color:var(--tromso);}
.stop.paris{color:var(--paris);}


/* =========================
   NAV
========================= */

.navbar{
  position:sticky;
  top:0;
  z-index:30;

  background:rgba(247,244,239,.92);
  backdrop-filter:blur(12px);

  border-bottom:1px solid var(--line);
  padding:9px 0;
}

.navbar-inner{
  max-width:920px;
  margin:auto;
  padding:0 16px;

  display:flex;
  gap:7px;

  overflow-x:auto;
  scrollbar-width:none;
}

.navbar-inner::-webkit-scrollbar{
  display:none;
}

.pill{
  flex:0 0 auto;

  border:1px solid var(--line);
  background:#fffdf9;

  border-radius:999px;

  padding:6px 11px;

  font-family:'IBM Plex Mono',monospace;
  font-size:10px;

  color:#77716a;

  cursor:pointer;
}

.pill.active{
  background:var(--ink);
  color:white;
  border-color:var(--ink);
}


/* =========================
   CONTENT
========================= */

.wrap{
  max-width:920px;
  margin:auto;
  padding:30px 16px 70px;
}


/* =========================
   COUNTRY CHAPTER
========================= */

.chapter{
  display:flex;
  align-items:center;
  gap:16px;

  margin:48px 0 18px;
}

.chapter:first-child{
  margin-top:8px;
}

.stamp{
  flex:0 0 62px;

  width:62px;
  height:62px;

  border-radius:50%;

  border:1.5px dashed currentColor;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  font-family:'DM Serif Display',serif;
  font-size:11px;

  transform:rotate(-7deg);

  background:rgba(255,255,255,.35);
}

.chapter-text h2{
  margin:0 0 3px;

  font-family:'DM Serif Display',serif;
  font-size:27px;
  font-weight:400;
}

.chapter-text p{
  margin:0;

  color:var(--soft);

  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
}

.chapter.london{color:var(--london);}
.chapter.cph{color:var(--cph);}
.chapter.tromso{color:var(--tromso);}
.chapter.paris{color:var(--paris);}


/* =========================
   DAY CARD
========================= */

.day{
  display:flex;

  background:var(--paper);

  border:1px solid var(--line);
  border-radius:15px;

  overflow:hidden;

  margin-bottom:13px;

  box-shadow:0 3px 13px rgba(60,45,30,.035);

  scroll-margin-top:70px;
}

.stub{
  flex:0 0 65px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  color:white;

  position:relative;
}

.stub::after{
  content:"";

  position:absolute;

  right:0;
  top:12px;
  bottom:12px;

  border-right:1px dashed rgba(255,255,255,.55);
}

.stub .num{
  font-family:'DM Serif Display',serif;
  font-size:27px;
  line-height:1;
}

.stub .wd,
.stub .dt{
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;

  margin-top:3px;

  opacity:.9;
}

.stub.london{background:var(--london);}
.stub.cph{background:var(--cph);}
.stub.tromso{background:var(--tromso);}
.stub.paris{background:var(--paris);}


.body{
  flex:1;
  min-width:0;

  padding:14px 16px 15px;
}

.body-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.headline{
  margin:0;

  font-family:'Noto Sans TC',sans-serif;
  font-weight:700;

  font-size:15px;
  line-height:1.45;
}

.subline{
  margin:3px 0 0;

  color:var(--soft);

  font-size:11px;
}


/* =========================
   PHOTO
========================= */

/*
  照片固定成比較舒服的旅遊手冊比例
  不再使用過矮的長條
*/

.gallery-grid{
  display:grid;

  grid-template-columns:repeat(
    auto-fit,
    minmax(150px,1fr)
  );

  gap:8px;

  margin:12px 0 12px;
}

.thumb-box{
  width:100%;

  aspect-ratio:16 / 10;

  border-radius:10px;

  overflow:hidden;

  background:#e9e2d8;

  border:1px solid rgba(0,0,0,.05);
}

.thumb-box img{
  width:100%;
  height:100%;

  object-fit:cover;

  /*
    確保照片不變形
  */
  object-position:center;
}


/* =========================
   MAIN ITEMS
========================= */

.section{
  margin-top:8px;
}

.section .label{
  font-size:10px;

  color:#9a9187;

  letter-spacing:.04em;

  margin-bottom:2px;
}

.section .items{
  font-size:12.5px;

  line-height:1.65;
}

.items a{
  color:var(--ink);

  text-decoration:none;

  border-bottom:1px dotted #aaa097;
}

.items a:hover{
  color:#a9843f;
}


/* =========================
   FOOD MINI ROW
========================= */

.food-row{
  display:flex;
  align-items:center;
  gap:7px;

  margin-top:9px;
  padding-top:8px;

  border-top:1px dashed var(--line);

  color:#81786e;
}

.food-title{
  flex:0 0 auto;

  font-family:'IBM Plex Mono',monospace;

  font-size:8.5px;

  letter-spacing:.08em;

  color:#a18a68;
}

.food-items{
  font-size:10.5px;
  line-height:1.5;
}

.food-item{
  display:inline-block;

  background:#f3eee7;

  border-radius:999px;

  padding:2px 7px;

  margin-right:3px;
  margin-bottom:2px;
}


/* =========================
   CHECK
========================= */

.check{
  flex:0 0 auto;

  width:23px;
  height:23px;

  border-radius:50%;

  border:1px solid var(--line);

  display:flex;
  align-items:center;
  justify-content:center;

  color:transparent;

  cursor:pointer;

  font-size:11px;
}

.check.checked{
  background:#87988a;
  border-color:#87988a;
  color:white;
}


/* =========================
   HOTELS
========================= */

.info-block{
  background:var(--paper);

  border:1px solid var(--line);

  border-radius:15px;

  padding:18px;

  margin-top:45px;
}

.info-block h3{
  margin:0 0 12px;

  font-family:'DM Serif Display',serif;

  font-size:20px;
  font-weight:400;
}

.hotel-row{
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:10px;

  padding:9px 0;

  border-bottom:1px dashed var(--line);

  font-size:12px;
}

.hotel-row:last-child{
  border-bottom:none;
}

.hotel-row a{
  color:var(--ink);
  text-decoration:none;
}

.hotel-city{
  display:inline-block;

  margin-left:5px;

  padding:2px 6px;

  border-radius:999px;

  background:#f0ebe3;

  font-size:9px;

  color:#81786e;
}


/* =========================
   FOOTER
========================= */

footer{
  text-align:center;

  padding:15px 20px 50px;

  color:#a0988e;

  font-family:'IBM Plex Mono',monospace;

  font-size:9px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .hero{
    padding-top:42px;
  }

  .route{
    padding:20px 8px;
  }

  .stop .city{
    font-size:14px;
  }

  .stop .date{
    font-size:8px;
  }

  .chapter{
    margin-top:38px;
  }

  .day{
    margin-bottom:11px;
  }

  .stub{
    flex-basis:58px;
  }

  .stub .num{
    font-size:23px;
  }

  .body{
    padding:12px 13px;
  }

  .gallery-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .thumb-box{
    aspect-ratio:16 / 10;
  }

  .headline{
    font-size:14px;
  }

  .section .items{
    font-size:12px;
  }

}

</style>
</head>

/* =========================================================

/* =========================================================
   Render item
========================================================= */

function renderItem(item){

  if(typeof item === 'string'){
    return item;
  }

  return `
    <a
      href="${item.url}"
      target="_blank"
      rel="noopener"
    >
      ${item.text}
    </a>
  `;
}


/* =========================================================
   Render food
========================================================= */

function renderFood(food){

  if(!food || food.length === 0){
    return '';
  }

  return `
    <div class="food-row">

      <div class="food-title">
        EAT
      </div>

      <div class="food-items">

        ${food.map(item => `
          <span class="food-item">
            ${item}
          </span>
        `).join('')}

      </div>

    </div>
  `;
}


/* =========================================================
   Build hotels
========================================================= */

function buildHotels(){

  const el = document.getElementById('hotels');

  el.innerHTML = HOTELS.map(h => {

    return `
      <div class="hotel-row">

        <span>

          <a
            href="${h.url}"
            target="_blank"
            rel="noopener"
          >
            ${h.name}
          </a>

          <span class="hotel-city">
            ${h.city}
          </span>

        </span>

      </div>
    `;

  }).join('');
}


/* =========================================================
   Build nav
========================================================= */

function buildNav(){

  const nav = document.getElementById('navbar');

  nav.innerHTML = DAYS.map(d => {

    return `
      <button
        class="pill"
        data-day="${d.d}"
      >
        D${d.d}
      </button>
    `;

  }).join('');

  nav.addEventListener('click', e => {

    const btn = e.target.closest('.pill');

    if(!btn) return;

    const target =
      document.getElementById(
        'day-' + btn.dataset.day
      );

    if(target){

      target.scrollIntoView({
        behavior:'smooth',
        block:'start'
      });

    }

  });

}


/* =========================================================
   Build days
========================================================= */

function buildDays(){

  const el = document.getElementById('days');

  let html = '';

  let lastCity = null;


  DAYS.forEach(d => {

    /* country chapter */

    if(d.city !== lastCity){

      const c = CHAPTERS[d.city];

      html += `

        <div class="chapter ${c.key}">

          <div class="stamp">
            ${c.name}
          </div>

          <div class="chapter-text">

            <h2>
              ${c.label}
            </h2>

            <p>
              ${c.nights}
            </p>

          </div>

        </div>

      `;

      lastCity = d.city;
    }


    /* images */

    let imagesHtml = '';

    if(d.images && d.images.length){

      imagesHtml = `

        <div class="gallery-grid">

          ${d.images.map(img => `

            <div class="thumb-box">

              <img
                src="${img}"
                alt="${d.title}"
                loading="lazy"
              >

            </div>

          `).join('')}

        </div>

      `;

    }


    /* sections */

    const sectionsHtml =
      (d.sections || []).map(section => {

        return `

          <div class="section">

            <div class="label">
              ${section.label}
            </div>

            <div class="items">

              ${section.items
                .map(renderItem)
                .join(' · ')}

            </div>

          </div>

        `;

      }).join('');


    /* day card */

    html += `

      <article
        class="day"
        id="day-${d.d}"
      >

        <div class="stub ${d.city}">

          <div class="num">
            ${d.d}
          </div>

          <div class="wd">
            週${d.wd}
          </div>

          <div class="dt">
            ${d.date}
          </div>

        </div>


        <div class="body">

          <div class="body-top">

            <div>

              <p class="headline">
                ${d.title}
              </p>

              <p class="subline">
                ${d.subline}
              </p>

            </div>

            <div
              class="check"
              data-day="${d.d}"
              title="完成"
            >
              ✓
            </div>

          </div>


          ${imagesHtml}


          ${sectionsHtml}


          ${renderFood(d.food)}

        </div>

      </article>

    `;

  });


  el.innerHTML = html;

}


/* =========================================================
   完成狀態
========================================================= */

let doneDays = [];

try{

  doneDays =
    JSON.parse(
      localStorage.getItem('honeymoon_done') || '[]'
    );

}catch(e){

  doneDays = [];

}


function saveDone(){

  try{

    localStorage.setItem(
      'honeymoon_done',
      JSON.stringify(doneDays)
    );

  }catch(e){}

}


function applyDoneState(){

  doneDays.forEach(d => {

    const card =
      document.getElementById(
        'day-' + d
      );

    const check =
      document.querySelector(
        `.check[data-day="${d}"]`
      );

    if(card){
      card.style.opacity = '.5';
    }

    if(check){
      check.classList.add('checked');
    }

  });

}


document.addEventListener('click', e => {

  const check =
    e.target.closest('.check');

  if(!check) return;

  const d =
    Number(check.dataset.day);

  const card =
    document.getElementById('day-' + d);


  if(doneDays.includes(d)){

    doneDays =
      doneDays.filter(x => x !== d);

    check.classList.remove('checked');

    if(card){
      card.style.opacity = '1';
    }

  }else{

    doneDays.push(d);

    check.classList.add('checked');

    if(card){
      card.style.opacity = '.5';
    }

  }

  saveDone();

});


/* =========================================================
   Active navigation
========================================================= */

function setupScrollSpy(){

  const cards =
    document.querySelectorAll('.day');

  const pills =
    document.querySelectorAll('.pill');


  const observer =
    new IntersectionObserver(

      entries => {

        entries.forEach(entry => {

          if(!entry.isIntersecting){
            return;
          }

          const day =
            entry.target.id
              .replace('day-','');

          pills.forEach(p => {

            p.classList.toggle(
              'active',
              p.dataset.day === day
            );

          });

        });

      },

      {
        rootMargin:'-30% 0px -60% 0px'
      }

    );


  cards.forEach(card =>
    observer.observe(card)
  );

}


/* =========================================================
   INIT
========================================================= */

buildNav();

buildDays();

buildHotels();

applyDoneState();

setupScrollSpy();

</script>
