     FONTS
========================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* =========================================================
   COLOR SYSTEM
========================================================= */
:root {
  --paper: #F5F3EF;
  --paper2: #ECE9E3;
  --white: #FFFDFC;
  --ink: #29313A;
  --soft: #737A7C;
  --line: #DDD9D1;
  --london: #58728B;
  --cph: #B56550;
  --tromso: #4C9178;
  --paris: #B47A8D;
  --gold: #B18A4A;
}

/* =========================================================
   GLOBAL
========================================================= */
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 10% 8%, rgba(177,138,74,.07), transparent 20%),
    radial-gradient(circle at 90% 30%, rgba(180,122,141,.06), transparent 22%),
    var(--paper);
  color: var(--ink);
  font-family: 'Noto Sans TC', sans-serif;
  -webkit-font-smoothing: antialiased;
}

a {
  color: inherit;
}

/* =========================================================
   HERO
========================================================= */
.hero {
  max-width: 920px;
  margin: 0 auto;
  padding: 55px 20px 30px;
  text-align: center;
  position: relative;
}

.hero-doodle {
  position: absolute;
  font-family: 'Fraunces', serif;
  font-size: 26px;
  opacity: .7;
}

.doodle-plane { left: 8%; top: 50px; transform: rotate(-12deg); }
.doodle-star  { right: 9%; top: 75px; font-size: 18px; }
.doodle-heart { left: 13%; bottom: 45px; font-size: 17px; transform: rotate(-8deg); }
.doodle-spark { right: 13%; bottom: 42px; font-size: 19px; }

.eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: .16em;
  color: var(--gold);
  margin-bottom: 14px;
}

.hero h1 {
  font-family: 'Fraunces', serif;
  font-size: clamp(38px, 7vw, 56px);
  font-weight: 600;
  letter-spacing: -.025em;
  margin: 0 0 8px;
}

.hero-sub {
  color: var(--soft);
  font-size: 14px;
  margin-bottom: 30px;
}

/* =========================================================
   ROUTE
========================================================= */
.route {
  background: rgba(255,253,252,.92);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 23px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 25px rgba(50,45,40,.04);
}

.route-line {
  position: absolute;
  left: 10%; right: 10%; top: 50%;
  border-top: 1px dashed #CFCAC0;
}

.stop {
  flex: 1;
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.stop .dot {
  width: 13px; height: 13px;
  border-radius: 50%;
  background: currentColor;
  border: 3px solid var(--white);
  box-shadow: 0 0 0 1px currentColor;
}

.stop .city {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 16px;
}

.stop .date {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9.5px;
  color: var(--soft);
}

.stop.london { color: var(--london); }
.stop.cph    { color: var(--cph); }
.stop.tromso { color: var(--tromso); }
.stop.paris  { color: var(--paris); }

/* =========================================================
   NAV
========================================================= */
.navbar {
  position: sticky; top: 0;
  z-index: 50;
  background: rgba(245,243,239,.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

.navbar-inner {
  max-width: 920px;
  margin: auto;
  padding: 10px 16px;
  display: flex;
  gap: 7px;
  overflow-x: auto;
  scrollbar-width: none;
}

.navbar-inner::-webkit-scrollbar { display: none; }

.pill {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 999px;
  padding: 6px 11px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--soft);
  cursor: pointer;
  transition: .2s ease;
}

.pill:hover, .pill.active {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}

/* =========================================================
   MAIN
========================================================= */
.wrap {
  max-width: 920px;
  margin: auto;
  padding: 25px 16px 70px;
}

/* =========================================================
   CITY CHAPTER
========================================================= */
.chapter {
  display: flex;
  align-items: center;
  gap: 17px;
  margin: 48px 0 18px;
  scroll-margin-top: 80px;
}

.chapter:first-child { margin-top: 10px; }

.country-stamp {
  width: 66px; height: 66px;
  flex: 0 0 66px;
  border: 2px dashed currentColor;
  border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transform: rotate(-7deg);
  background: rgba(255,255,255,.45);
}

.country-stamp .en {
  font-family: 'Fraunces', serif;
  font-size: 12px; font-weight: 700;
  letter-spacing: .05em;
}

.country-stamp .tiny {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 7px; opacity: .7;
  margin-top: 2px;
}

.chapter-copy h2 {
  margin: 0;
  font-family: 'Fraunces', serif;
  font-size: 27px; font-weight: 600;
}

.chapter-copy p {
  margin: 3px 0 0;
  color: var(--soft);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
}

.chapter.london { color: var(--london); }
.chapter.cph    { color: var(--cph); }
.chapter.tromso { color: var(--tromso); }
.chapter.paris  { color: var(--paris); }

/* =========================================================
   DAY CARD
========================================================= */
.day {
  display: grid;
  grid-template-columns: 70px 1fr;
  background: rgba(255,253,252,.94);
  border: 1px solid var(--line);
  border-radius: 15px;
  overflow: hidden;
  margin-bottom: 13px;
  box-shadow: 0 5px 18px rgba(50,45,40,.035);
  scroll-margin-top: 82px;
}

.stub {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: white;
  padding: 12px 5px;
}

.stub.london { background: var(--london); }
.stub.cph    { background: var(--cph); }
.stub.tromso { background: var(--tromso); }
.stub.paris  { background: var(--paris); }

.stub .num {
  font-family: 'Fraunces', serif;
  font-size: 25px; line-height: 1; font-weight: 700;
}

.stub .wd {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; margin-top: 4px; opacity: .9;
}

.stub .dt {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; opacity: .9;
}

/* =========================================================
   DAY CONTENT
========================================================= */
.day-body {
  padding: 14px 16px 15px;
  min-width: 0;
}

.day-title {
  font-family: 'Fraunces', serif;
  font-size: 17px; font-weight: 600;
  margin: 0;
  line-height: 1.35;
}

.day-sub {
  margin: 3px 0 9px;
  color: var(--soft);
  font-size: 11px;
}

/* =========================================================
   PHOTO - 完全修正與精緻化：
   - 強制在任何螢幕上均為小巧尺寸
   - 最大寬度為容器的 40% 且不超過 250px
   - 保持圖片原比例，移除任何垂直拉伸
========================================================= */
.photo {
  max-width: 40%; /* 桌面和行動端都一樣 */
  max-height: 250px; /* 限制垂直方向的過度佔用 */
  overflow: hidden;
  margin: 10px 0 13px;
  position: relative;
  border: 1px solid rgba(221,217,209,.85);
  border-radius: 10px; /* 加入一點圓角使之更精緻 */
  box-shadow: 0 3px 10px rgba(50,45,40,.045);
}

.photo img {
  width: 100%; height: auto; /* 強制保持原比例 */
  display: block;
  object-fit: cover; /* 如果垂直比例太大，僅裁切而非拉伸 */
  object-position: center;
}

/* =========================================================
   FOOD
========================================================= */
.food {
  display: flex; align-items: flex-start;
  gap: 7px;
  margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--line);
  font-size: 11px; color: #60676A;
}

.food-label {
  flex: 0 0 auto;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; color: var(--gold);
  padding-top: 2px;
}

.food-text { line-height: 1.65; }

/* =========================================================
   PLACES
========================================================= */
.places {
  font-size: 12.5px;
  line-height: 1.8;
  color: #4E565A;
}

.places a {
  text-decoration: none;
  border-bottom: 1px dotted #AEB0AD;
}

.places a:hover { color: var(--gold); }

/* =========================================================
   DECORATION
========================================================= */
.day-decoration {
  float: right;
  font-family: 'Fraunces', serif;
  font-size: 17px;
  opacity: .4;
}

/* =========================================================
   HOTELS
========================================================= */
.info-block {
  background: rgba(255,253,252,.94);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 20px;
  margin-top: 50px;
}

.info-block h3 {
  font-family: 'Fraunces', serif;
  font-size: 19px;
  margin: 0 0 13px;
}

.hotel-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 9px 0;
  border-bottom: 1px dashed var(--line);
  font-size: 12.5px;
}

.hotel-row:last-child { border-bottom: none; }

.hotel-city {
  color: var(--soft);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  margin-left: 5px;
}

/* =========================================================
   FOOTER
========================================================= */
footer {
  text-align: center;
  color: var(--soft);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  padding: 30px 15px 50px;
}

/* =========================================================
   MOBILE
========================================================= */
@media (max-width: 600px) {
  .hero { padding-top: 42px; }
  .hero-doodle { display: none; }
  .route { padding: 19px 8px; }
  .stop .city { font-size: 13px; }
  .stop .date { font-size: 8px; }
  .day { grid-template-columns: 57px 1fr; }
  .stub .num { font-size: 22px; }
  .day-body { padding: 13px 13px 14px; }
  
  /* 行動端也強制小巧，移除全寬設定 */
  .photo {
    width: 40%; /* 保持小體積 */
    aspect-ratio: auto; /* 移除任何寬高限制 */
    margin: 10px 0 13px;
  }
  
  .day-title { font-size: 16px; }
  .places { font-size: 12px; }
  .chapter { margin-top: 38px; }
}

/* =========================================================
   VERY SMALL PHONE
========================================================= */
@media (max-width: 380px) {
  .day { grid-template-columns: 53px 1fr; }
  .day-body { padding: 12px 11px 13px; }
  .stub .num { font-size: 20px; }
}
</style>
</head>

];

const CHAPTERS = {
  london: { name:"LONDON", label:"倫敦", nights:"9/18 — 9/25 · 7 天" },
  cph: { name:"COPENHAGEN", label:"哥本哈根", nights:"9/25 — 9/29 · 4 天" },
  tromso: { name:"TROMSØ", label:"特羅姆瑟", nights:"9/29 — 10/3 · 4 天" },
  paris: { name:"PARIS", label:"巴黎", nights:"10/3 — 10/10 · 8 天" }
};

const nav = document.getElementById("navbar");
DAYS.forEach(day => {
  const button = document.createElement("button");
  button.className = "pill";
  button.innerHTML = `D${day.d}`;
  button.onclick = () => {
    document.getElementById(`day-${day.d}`).scrollIntoView({ behavior:"smooth", block:"start" });
  };
  nav.appendChild(button);
});

const daysEl = document.getElementById("days");
let lastCity = "";

DAYS.forEach(day => {
  // CITY CHAPTER
  if (day.city !== lastCity) {
    const c = CHAPTERS[day.city];
    daysEl.insertAdjacentHTML("beforeend", `
      <div class="chapter ${day.city}">
        <div class="country-stamp">
          <div class="en">${c.name}</div>
          <div class="tiny">HONEYMOON</div>
        </div>
        <div class="chapter-copy">
          <h2>${c.label}</h2>
          <p>${c.nights}</p>
        </div>
      </div>
    `);
    lastCity = day.city;
  }

  // PHOTO HTML
  let photoHTML = "";
  if (PHOTOS[day.d]) {
    photoHTML = `
      <div class="photo">
        <img src="${PHOTOS[day.d]}" alt="${day.title}" loading="lazy">
      </div>
    `;
  }

  // FOOD HTML
  let foodHTML = "";
  if (day.food) {
    foodHTML = `
      <div class="food">
        <div class="food-label">EAT</div>
        <div class="food-text">${day.food}</div>
      </div>
    `;
  }

  // DAY CARD
  daysEl.insertAdjacentHTML("beforeend", `
    <article class="day" id="day-${day.d}">
      <div class="stub ${day.city}">
        <div class="num">${day.d}</div>
        <div class="wd">週${day.wd}</div>
        <div class="dt">${day.date}</div>
      </div>
      <div class="day-body">
        <div class="day-decoration">
          ${day.d % 3 === 0 ? "✦" : day.d % 3 === 1 ? "♡" : "✧"}
        </div>
        <h3 class="day-title">${day.title}</h3>
        <div class="day-sub">${day.sub}</div>
        ${photoHTML}
        <div class="places">${day.places}</div>
        ${foodHTML}
      </div>
    </article>
  `);
});

const dayCards = document.querySelectorAll(".day");
const pills = document.querySelectorAll(".pill");
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const id = entry.target.id.replace("day-","");
      pills.forEach(p => p.classList.remove("active"));
      const active = [...pills].find(p => p.textContent.trim() === `D${id}`);
      if (active) {
        active.classList.add("active");
        active.scrollIntoView({ behavior:"smooth", block:"nearest", inline:"center" });
      }
    }
  });
}, { rootMargin: "-25% 0px -65% 0px" });

dayCards.forEach(day => observer.observe(day));
</script>
