<title>歐洲蜜月 2026 · 行程手冊</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#F3F5F4;
  --paper-2:#EAEDEB;
  --ink:#1D2430;
  --ink-soft:#5A6472;
  --rule:#D7DDE0;
  --gold:#A9843F;

  --london:#4E6E8E;
  --london-tint:#E9EEF2;

  --cph:#B3543F;
  --cph-tint:#F4E9E5;

  --tromso:#3E9E76;
  --tromso-tint:#E8F2ED;

  --paris:#B4738A;
  --paris-tint:#F4E9EE;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}

.display{
  font-family:'Fraunces',serif;
}

.mono{
  font-family:'IBM Plex Mono',monospace;
}

/* =========================
   HERO
========================= */

.hero{
  padding:56px 20px 28px;
  max-width:900px;
  margin:0 auto;
  text-align:center;
}

.hero .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:14px;
}

.hero h1{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:clamp(32px,7vw,52px);
  margin:0 0 8px;
  letter-spacing:-.01em;
}

.hero .sub{
  color:var(--ink-soft);
  font-size:15px;
  margin-bottom:34px;
}

/* Route */

.route{
  display:flex;
  align-items:center;
  justify-content:space-between;

  background:#fff;
  border:1px solid var(--rule);
  border-radius:14px;

  padding:22px clamp(10px,4vw,32px);

  position:relative;
  overflow:hidden;
}

.route::before,
.route::after{
  content:"";
  position:absolute;

  width:22px;
  height:22px;

  background:var(--paper);
  border:1px solid var(--rule);

  border-radius:50%;

  top:50%;
  transform:translateY(-50%);
}

.route::before{
  left:-11px;
}

.route::after{
  right:-11px;
}

.route-line{
  position:absolute;
  left:8%;
  right:8%;
  top:50%;

  height:1px;

  background:
    repeating-linear-gradient(
      90deg,
      var(--rule) 0 6px,
      transparent 6px 12px
    );

  z-index:0;
}

.stop{
  position:relative;
  z-index:1;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:6px;

  flex:1;
}

.stop .dot{
  width:11px;
  height:11px;

  border-radius:50%;

  border:2px solid #fff;

  box-shadow:
    0 0 0 1.5px currentColor;
}

.stop .city{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:clamp(12px,2.6vw,16px);
}

.stop .date{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  color:var(--ink-soft);
}

.stop.london{
  color:var(--london);
}

.stop.cph{
  color:var(--cph);
}

.stop.tromso{
  color:var(--tromso);
}

.stop.paris{
  color:var(--paris);
}

/* =========================
   NAV
========================= */

.navbar{
  position:sticky;
  top:0;
  z-index:50;

  background:rgba(243,245,244,.94);

  backdrop-filter:blur(8px);

  border-bottom:1px solid var(--rule);

  padding:10px 0;
}

.navbar-inner{
  max-width:900px;
  margin:0 auto;
  padding:0 16px;

  display:flex;
  gap:8px;

  overflow-x:auto;

  scrollbar-width:none;
}

.navbar-inner::-webkit-scrollbar{
  display:none;
}

.pill{
  flex:0 0 auto;

  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;

  padding:7px 12px;

  border-radius:999px;

  border:1px solid var(--rule);

  background:#fff;

  color:var(--ink-soft);

  cursor:pointer;

  white-space:nowrap;

  transition:.15s ease;
}

.pill:hover{
  border-color:var(--ink);
  color:var(--ink);
}

.pill.active{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

/* =========================
   MAIN
========================= */

.wrap{
  max-width:900px;
  margin:0 auto;
  padding:36px 16px 80px;
}

/* =========================
   HOTEL
========================= */

.info-block{
  background:#fff;
  border:1px solid var(--rule);
  border-radius:14px;

  padding:20px 20px 22px;

  margin-bottom:18px;
}

.info-block h3{
  font-family:'Fraunces',serif;
  font-size:18px;

  margin:0 0 12px;
}

.hotel-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  padding:9px 0;

  border-bottom:1px dashed var(--rule);

  font-size:13.5px;
}

.hotel-row:last-child{
  border-bottom:none;
}

.hotel-city{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;

  padding:3px 7px;

  border-radius:5px;

  background:var(--paper-2);

  color:var(--ink-soft);

  margin-right:7px;
}

.hotel-row a{
  color:var(--ink);
  text-decoration:none;
}

.hotel-row a:hover{
  color:var(--gold);
}

/* =========================
   CITY CHAPTER
========================= */

.chapter{
  display:flex;
  align-items:center;

  gap:18px;

  margin:56px 0 22px;
}

.chapter:first-child{
  margin-top:8px;
}

.stamp{
  flex:0 0 auto;

  width:64px;
  height:64px;

  border-radius:50%;

  border:2px dashed currentColor;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:'Fraunces',serif;

  font-weight:700;
  font-size:11px;

  text-align:center;
  line-height:1.2;

  transform:rotate(-8deg);

  letter-spacing:.02em;
}

.chapter-text h2{
  font-family:'Fraunces',serif;

  font-size:26px;

  margin:0 0 3px;

  font-weight:600;
}

.chapter-text p{
  margin:0;

  color:var(--ink-soft);

  font-size:13px;

  font-family:'IBM Plex Mono',monospace;
}

.chapter.london{
  color:var(--london);
}

.chapter.cph{
  color:var(--cph);
}

.chapter.tromso{
  color:var(--tromso);
}

.chapter.paris{
  color:var(--paris);
}

/* =========================
   DAY CARD
========================= */

.day{
  display:flex;

  background:#fff;

  border:1px solid var(--rule);

  border-radius:14px;

  margin-bottom:14px;

  overflow:hidden;

  scroll-margin-top:70px;

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.day:hover{
  transform:translateY(-1px);

  box-shadow:
    0 5px 18px rgba(29,36,48,.06);
}

/* Date */

.stub{
  flex:0 0 78px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:4px;

  padding:14px 8px;

  color:#fff;

  position:relative;

  text-align:center;
}

.stub::after{
  content:"";

  position:absolute;

  right:0;
  top:0;
  bottom:0;

  border-right:2px dashed rgba(255,255,255,.5);
}

.stub .num{
  font-family:'Fraunces',serif;

  font-size:26px;

  font-weight:700;

  line-height:1;
}

.stub .wd{
  font-family:'IBM Plex Mono',monospace;

  font-size:9.5px;

  opacity:.9;
}

.stub .dt{
  font-family:'IBM Plex Mono',monospace;

  font-size:10px;

  opacity:.9;
}

.stub.london{
  background:var(--london);
}

.stub.cph{
  background:var(--cph);
}

.stub.tromso{
  background:var(--tromso);
}

.stub.paris{
  background:var(--paris);
}

/* Body */

.body{
  flex:1;

  min-width:0;

  padding:14px 17px 16px;
}

.headline{
  font-family:'Fraunces',serif;

  font-weight:600;

  font-size:17px;

  margin:0 0 3px;
}

.subline{
  font-size:11.5px;

  color:var(--ink-soft);

  margin:0 0 10px;
}

/* =========================
   PHOTO
========================= */

.photo{
  width:100%;

  aspect-ratio:2.8 / 1;

  border-radius:9px;

  overflow:hidden;

  margin:9px 0 12px;

  background:var(--paper-2);

  border:1px solid var(--rule);
}

.photo img{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  object-position:center;
}

/* =========================
   SUMMARY
========================= */

.summary{
  display:flex;

  flex-wrap:wrap;

  gap:6px 8px;

  margin-top:8px;
}

.summary-item{
  font-size:12px;

  line-height:1.5;

  padding:6px 9px;

  background:var(--paper-2);

  border-radius:6px;

  color:var(--ink);
}

.summary-item a{
  color:inherit;

  text-decoration:
    underline dotted;

  text-underline-offset:2px;
}

.summary-item a:hover{
  color:var(--gold);
}

/* Important */

.note{
  margin-top:10px;

  font-size:11.5px;

  color:var(--ink-soft);

  background:var(--paper-2);

  border-left:3px solid var(--gold);

  padding:7px 9px;

  border-radius:0 6px 6px 0;

  line-height:1.6;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .hero{
    padding-top:42px;
  }

  .route{
    padding:18px 7px;
  }

  .stop .city{
    font-size:12px;
  }

  .stop .date{
    font-size:9px;
  }

  .chapter{
    margin-top:42px;
  }

  .stamp{
    width:56px;
    height:56px;
  }

  .chapter-text h2{
    font-size:23px;
  }

  .day{
    border-radius:12px;
  }

  .stub{
    flex-basis:62px;
  }

  .stub .num{
    font-size:22px;
  }

  .body{
    padding:12px 12px 14px;
  }

  .headline{
    font-size:15.5px;
  }

  .subline{
    font-size:11px;
  }

  .photo{
    aspect-ratio:2.25 / 1;
  }

  .summary-item{
    font-size:11.5px;
  }

  .hotel-row{
    align-items:flex-start;
  }
}

footer{
  text-align:center;

  padding:20px 16px 45px;

  color:var(--ink-soft);

  font-size:11px;

  font-family:'IBM Plex Mono',monospace;
}
</style>

/* =========================================================
   Render 住宿
========================================================= */

function buildHotels(){

  const el=document.getElementById("hotels");

  el.innerHTML=HOTELS.map(h=>`

    <div class="hotel-row">

      <div>
        <span class="hotel-city">${h.city}</span>

        ${
          h.url && h.url !== "#"
          ? `<a href="${h.url}" target="_blank" rel="noopener">${h.name}</a>`
          : h.name
        }
      </div>

    </div>

  `).join("");

}


/* =========================================================
   Render Navigation
========================================================= */

function buildNav(){

  const nav=document.getElementById("navbar");

  nav.innerHTML=DAYS.map(d=>`

    <button
      class="pill"
      data-day="${d.d}">
      D${d.d} · ${d.date}
    </button>

  `).join("");

  nav.addEventListener("click",function(e){

    const btn=e.target.closest(".pill");

    if(!btn) return;

    const target=document.getElementById(
      "day-"+btn.dataset.day
    );

    if(target){

      target.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    }

  });

}


/* =========================================================
   Render Item
========================================================= */

function renderItem(item){

  if(typeof item === "string"){

    return `
      <div class="summary-item">
        ${item}
      </div>
    `;

  }

  return `
    <div class="summary-item">

      <a
        href="${item[1]}"
        target="_blank"
        rel="noopener">

        ${item[0]}

      </a>

    </div>
  `;

}


/* =========================================================
   Render Days
========================================================= */

function buildDays(){

  const el=document.getElementById("days");

  let html="";

  let lastCity=null;

  DAYS.forEach(d=>{

    /* 城市章 */

    if(d.city !== lastCity){

      const c=CHAPTERS[d.city];

      html+=`

        <div class="chapter ${c.key}">

          <div class="stamp">
            ${c.name}
          </div>

          <div class="chapter-text">

            <h2>
              ${c.label}
            </h2>

            <p>
              ${c.nights}
            </p>

          </div>

        </div>

      `;

      lastCity=d.city;

    }


    /* Photo */

    const photoHTML=d.image
      ? `
        <div class="photo">

          <img
            src="${d.image}"
            alt="${d.title}"
            loading="lazy"
            onerror="this.parentElement.style.display='none';">

        </div>
      `
      : "";


    /* Summary */

    const itemsHTML=d.items
      .map(renderItem)
      .join("");


    /* Note */

    const noteHTML=d.note
      ? `
        <div class="note">
          ${d.note}
        </div>
      `
      : "";


    html+=`

      <article
        class="day"
        id="day-${d.d}">

        <div class="stub ${d.city}">

          <div class="num">
            ${d.d}
          </div>

          <div class="wd">
            週${d.wd}
          </div>

          <div class="dt">
            ${d.date}
          </div>

        </div>


        <div class="body">

          <p class="headline">
            ${d.title}
          </p>

          <p class="subline">
            ${d.subline}
          </p>

          ${photoHTML}

          <div class="summary">

            ${itemsHTML}

          </div>

          ${noteHTML}

        </div>

      </article>

    `;

  });


  el.innerHTML=html;

}


/* =========================================================
   Scroll Spy
========================================================= */

function setupScrollSpy(){

  const days=document.querySelectorAll(".day");

  const pills=document.querySelectorAll(".pill");

  const observer=new IntersectionObserver(

    entries=>{

      entries.forEach(entry=>{

        if(entry.isIntersecting){

          const day=entry.target.dataset.day;

          pills.forEach(p=>{
            p.classList.toggle(
              "active",
              p.dataset.day===day
            );
          });

        }

      });

    },

    {
      rootMargin:"-30% 0px -60% 0px",
      threshold:0
    }

  );

  days.forEach(day=>{
    observer.observe(day);
  });

}


/* =========================================================
   Initialize
========================================================= */

buildHotels();

buildNav();

buildDays();

setupScrollSpy();

</script>
